<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780">
  <style>
    text { font-family: monospace; font-size: 11px; fill: #333; }
    .title { font-size: 14px; font-weight: bold; }
    .label { font-size: 9px; fill: #666; }
    .grid { stroke: #ccc; stroke-width: 0.5; fill: none; }
    .runway { fill: #616161; }
    .runway-dash { fill: #fff; }
    .apron { fill: #888; }
    .taxiway { fill: #777; }
    .terminal { fill: #eceff1; stroke: #b0bec5; stroke-width: 1; }
    .terminal-accent { fill: #2196f3; }
    .tower-stem { fill: #cfd8dc; }
    .tower-cab { fill: #90caf9; }
    .hangar { fill: #b0b0b0; stroke: #999; stroke-width: 0.5; }
    .parking { fill: #9e9e9e; }
    .plane-body { fill: #eee; stroke: #bbb; stroke-width: 0.5; }
    .plane-wing { fill: #ddd; stroke: #bbb; stroke-width: 0.5; }
    .plane-tail { fill: #2196f3; }
    .bridge { fill: #b0bec5; stroke: #90a4ae; stroke-width: 0.5; }
    .cargo { fill: #a1887f; stroke: #8d6e63; stroke-width: 0.5; }
    .footprint { fill: rgba(76,175,80,0.08); stroke: #4caf50; stroke-width: 1; stroke-dasharray: 4,3; }
  </style>

  <!-- ========== SMALL (3×2) ========== -->
  <g transform="translate(30, 30)">
    <text x="90" y="0" class="title" text-anchor="middle">SMALL (3×2)</text>
    <text x="90" y="16" class="label" text-anchor="middle">$5,000 · Pop 10K</text>

    <!-- Grid 3×2, each cell = 60px -->
    <rect x="0" y="30" width="180" height="120" class="footprint"/>
    <!-- grid lines -->
    <line x1="60" y1="30" x2="60" y2="150" class="grid"/>
    <line x1="120" y1="30" x2="120" y2="150" class="grid"/>
    <line x1="0" y1="90" x2="180" y2="90" class="grid"/>

    <!-- Runway (bottom, full width) -->
    <rect x="5" y="120" width="170" height="22" rx="2" class="runway"/>
    <!-- dashes -->
    <rect x="30" y="129" width="16" height="4" class="runway-dash"/>
    <rect x="82" y="129" width="16" height="4" class="runway-dash"/>
    <rect x="134" y="129" width="16" height="4" class="runway-dash"/>

    <!-- Apron -->
    <rect x="25" y="88" width="130" height="30" rx="1" class="apron"/>

    <!-- Taxiway -->
    <rect x="80" y="118" width="20" height="6" class="taxiway"/>

    <!-- Terminal (top area) -->
    <rect x="20" y="40" width="140" height="40" rx="2" class="terminal"/>
    <rect x="20" y="75" width="140" height="5" class="terminal-accent"/>

    <!-- 1 jet bridge -->
    <rect x="85" y="78" width="10" height="12" class="bridge"/>

    <!-- Labels -->
    <text x="90" y="168" class="label" text-anchor="middle">3 cells × 2 cells</text>
  </g>

  <!-- ========== MEDIUM (5×4) ========== -->
  <g transform="translate(260, 30)">
    <text x="150" y="0" class="title" text-anchor="middle">MEDIUM (5×4)</text>
    <text x="150" y="16" class="label" text-anchor="middle">$15,000 · Pop 50K</text>

    <!-- Grid 5×4, each cell = 60px -->
    <rect x="0" y="30" width="300" height="240" class="footprint"/>
    <line x1="60" y1="30" x2="60" y2="270" class="grid"/>
    <line x1="120" y1="30" x2="120" y2="270" class="grid"/>
    <line x1="180" y1="30" x2="180" y2="270" class="grid"/>
    <line x1="240" y1="30" x2="240" y2="270" class="grid"/>
    <line x1="0" y1="90" x2="300" y2="270" class="grid"/>
    <line x1="0" y1="150" x2="300" y2="150" class="grid"/>
    <line x1="0" y1="210" x2="300" y2="210" class="grid"/>

    <!-- Runway -->
    <rect x="8" y="232" width="284" height="28" rx="2" class="runway"/>
    <rect x="40" y="243" width="20" height="5" class="runway-dash"/>
    <rect x="100" y="243" width="20" height="5" class="runway-dash"/>
    <rect x="160" y="243" width="20" height="5" class="runway-dash"/>
    <rect x="220" y="243" width="20" height="5" class="runway-dash"/>
    <!-- threshold -->
    <rect x="12" y="235" width="4" height="22" class="runway-dash"/>

    <!-- Taxiway -->
    <rect x="140" y="218" width="22" height="16" class="taxiway"/>

    <!-- Apron -->
    <rect x="40" y="170" width="220" height="46" rx="1" class="apron"/>

    <!-- Terminal -->
    <rect x="30" y="55" width="240" height="60" rx="3" class="terminal"/>
    <rect x="30" y="110" width="240" height="6" class="terminal-accent"/>

    <!-- 3 jet bridges -->
    <rect x="90" y="114" width="12" height="16" class="bridge"/>
    <rect x="148" y="114" width="12" height="16" class="bridge"/>
    <rect x="206" y="114" width="12" height="16" class="bridge"/>

    <!-- Control tower -->
    <rect x="18" y="60" width="10" height="50" rx="2" class="tower-stem"/>
    <rect x="14" y="52" width="18" height="12" rx="2" class="tower-cab"/>

    <!-- Hangar -->
    <rect x="10" y="170" width="40" height="36" rx="2" class="hangar"/>
    <text x="30" y="192" class="label" text-anchor="middle">Hangar</text>

    <!-- Parking -->
    <rect x="30" y="130" width="60" height="30" rx="1" class="parking"/>
    <text x="60" y="149" class="label" text-anchor="middle">P</text>

    <text x="150" y="288" class="label" text-anchor="middle">5 cells × 4 cells</text>
  </g>

  <!-- ========== LARGE (7×6) — dual runway, same side ========== -->
  <g transform="translate(30, 330)">
    <text x="210" y="0" class="title" text-anchor="middle">LARGE (7×6) — Dual Runway</text>
    <text x="210" y="16" class="label" text-anchor="middle">$40,000 · Pop 100K</text>

    <!-- Grid 7×6, each cell = 60px -->
    <rect x="0" y="30" width="420" height="360" class="footprint"/>
    <line x1="60" y1="30" x2="60" y2="390" class="grid"/>
    <line x1="120" y1="30" x2="120" y2="390" class="grid"/>
    <line x1="180" y1="30" x2="180" y2="390" class="grid"/>
    <line x1="240" y1="30" x2="240" y2="390" class="grid"/>
    <line x1="300" y1="30" x2="300" y2="390" class="grid"/>
    <line x1="360" y1="30" x2="360" y2="390" class="grid"/>
    <line x1="0" y1="90" x2="420" y2="90" class="grid"/>
    <line x1="0" y1="150" x2="420" y2="150" class="grid"/>
    <line x1="0" y1="210" x2="420" y2="210" class="grid"/>
    <line x1="0" y1="270" x2="420" y2="270" class="grid"/>
    <line x1="0" y1="330" x2="420" y2="330" class="grid"/>

    <!-- ── Top: Terminal area (rows 1-3) ── -->

    <!-- Parking (top-left) -->
    <rect x="10" y="38" width="56" height="36" rx="1" class="parking"/>
    <text x="38" y="60" class="label" text-anchor="middle">P</text>

    <!-- Main Terminal -->
    <rect x="50" y="38" width="320" height="56" rx="3" class="terminal"/>
    <rect x="50" y="89" width="320" height="7" class="terminal-accent"/>

    <!-- Control tower (tall) -->
    <rect x="378" y="42" width="14" height="56" rx="2" class="tower-stem"/>
    <rect x="372" y="32" width="26" height="14" rx="3" class="tower-cab"/>

    <!-- 5 jet bridges (from terminal down) -->
    <rect x="100" y="94" width="12" height="14" class="bridge"/>
    <rect x="160" y="94" width="12" height="14" class="bridge"/>
    <rect x="210" y="94" width="12" height="14" class="bridge"/>
    <rect x="260" y="94" width="12" height="14" class="bridge"/>
    <rect x="320" y="94" width="12" height="14" class="bridge"/>

    <!-- Apron -->
    <rect x="60" y="108" width="300" height="60" rx="1" class="apron"/>

    <!-- Cargo area (right) -->
    <rect x="370" y="108" width="42" height="56" rx="1" class="cargo"/>
    <text x="391" y="140" class="label" text-anchor="middle">Cargo</text>

    <!-- 2 Hangars (left) -->
    <rect x="8" y="108" width="46" height="56" rx="2" class="hangar"/>
    <text x="31" y="140" class="label" text-anchor="middle">H1 H2</text>

    <!-- ── Bottom: Dual runways (rows 4-6) ── -->

    <!-- Taxiways connecting apron to runways -->
    <rect x="120" y="168" width="22" height="30" class="taxiway"/>
    <rect x="280" y="168" width="22" height="30" class="taxiway"/>

    <!-- Grass/buffer between taxiway area and runways -->

    <!-- Runway 1 (upper runway) -->
    <rect x="8" y="220" width="404" height="26" rx="2" class="runway"/>
    <rect x="40" y="230" width="22" height="5" class="runway-dash"/>
    <rect x="120" y="230" width="22" height="5" class="runway-dash"/>
    <rect x="200" y="230" width="22" height="5" class="runway-dash"/>
    <rect x="280" y="230" width="22" height="5" class="runway-dash"/>
    <rect x="360" y="230" width="22" height="5" class="runway-dash"/>
    <rect x="12" y="222" width="4" height="22" class="runway-dash"/>
    <text x="415" y="238" class="label">R1</text>

    <!-- Taxiway connecting R1 ↔ R2 -->
    <rect x="80" y="246" width="22" height="50" class="taxiway"/>
    <rect x="320" y="246" width="22" height="50" class="taxiway"/>

    <!-- Runway 2 (lower runway, parallel) -->
    <rect x="8" y="310" width="404" height="26" rx="2" class="runway"/>
    <rect x="40" y="320" width="22" height="5" class="runway-dash"/>
    <rect x="120" y="320" width="22" height="5" class="runway-dash"/>
    <rect x="200" y="320" width="22" height="5" class="runway-dash"/>
    <rect x="280" y="320" width="22" height="5" class="runway-dash"/>
    <rect x="360" y="320" width="22" height="5" class="runway-dash"/>
    <rect x="404" y="312" width="4" height="22" class="runway-dash"/>
    <text x="415" y="328" class="label">R2</text>

    <!-- Taxiway label -->
    <text x="210" y="280" class="label" text-anchor="middle" style="fill:#999">~ taxiway ~</text>

    <text x="210" y="408" class="label" text-anchor="middle">7 cells × 6 cells</text>
  </g>
</svg>
